repository = "bmo-ui"
base = true

[coverage]
# The layer's code stands in these folders. The layout adds a Cargo package's src/ and the
# repository's own client/ project, and this repository has neither.
layout = "bmo-next"
roots = ["app/", "catalogue/", "shared/", "mcp/", "bin/"]
# The typed declarations alone: the host's i18n types, which no screen of the layer's own reads.
unindexed = ["app/i18n.d.ts"]
